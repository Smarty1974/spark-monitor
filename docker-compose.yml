services:

  # ── MongoDB ──────────────────────────────────────────────────────────────────
  mongodb:
    image: mongo:7-jammy
    environment:
      MONGO_INITDB_DATABASE: spark_monitor
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Batch Service (Quarkus) ───────────────────────────────────────────────────
  batch-service:
    build: ./services/batch-service
    ports:
      - "8080:8080"
    environment:
      MONGO_URI:                     mongodb://mongodb:27017
      MONGO_DB:                      spark_monitor
      GCP_PROJECT_ID:                ${GCP_PROJECT_ID:-my-gcp-project}
      GCP_REGION:                    ${GCP_REGION:-europe-west1}
      GOOGLE_APPLICATION_CREDENTIALS: /app/gcp-sa-key.json
      SPARK_MONITORING_ENABLED:      "true"
      SPARK_MONITORING_CRON:         "0/30 * * * * ?"
      SPARK_MONITORING_TIMEOUT_MINUTES: "120"
      SPARK_MONITORING_MAX_PARALLEL: "10"
      SPARK_MONITORING_FETCH_BATCH:  "50"
    volumes:
      # Monta il Service Account key GCP (sviluppo locale)
      # In produzione: usare Workload Identity
      - ${GCP_SA_KEY_PATH:-./gcp-sa-key-placeholder.json}:/app/gcp-sa-key.json:ro
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/q/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ── Frontend (React-Admin + IsycorePV) ────────────────────────────────────────
  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      batch-service:
        condition: service_healthy

volumes:
  mongo_data:
