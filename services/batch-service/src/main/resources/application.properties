# ── HTTP ─────────────────────────────────────────────────────────────────────
quarkus.http.port=8080
quarkus.http.root-path=/api

# ── CORS ─────────────────────────────────────────────────────────────────────
quarkus.http.cors=true
quarkus.http.cors.origins=/.*/
quarkus.http.cors.methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
quarkus.http.cors.headers=Content-Type,Authorization,X-Total-Count
quarkus.http.cors.exposed-headers=X-Total-Count

# ── MongoDB ───────────────────────────────────────────────────────────────────
quarkus.mongodb.connection-string=${MONGO_URI:mongodb://localhost:27017}
quarkus.mongodb.database=${MONGO_DB:spark_monitor}

# ── JWT ───────────────────────────────────────────────────────────────────────
mp.jwt.verify.issuer=https://sbm.example.com
mp.jwt.verify.publickey.location=META-INF/resources/publicKey.pem
smallrye.jwt.sign.key.location=META-INF/resources/privateKey.pem

# ── GCP ───────────────────────────────────────────────────────────────────────
# In produzione: GOOGLE_APPLICATION_CREDENTIALS=/path/sa-key.json  (locale)
#               oppure Workload Identity Federation su GKE (automatico)
gcp.project-id=${GCP_PROJECT_ID:my-gcp-project}
gcp.region=${GCP_REGION:europe-west1}

# ── SparkMonitoringScheduler ─────────────────────────────────────────────────
spark.monitoring.enabled=${SPARK_MONITORING_ENABLED:true}
spark.monitoring.cron=${SPARK_MONITORING_CRON:0/30 * * * * ?}
spark.monitoring.timeout-minutes=${SPARK_MONITORING_TIMEOUT_MINUTES:120}
spark.monitoring.max-parallel=${SPARK_MONITORING_MAX_PARALLEL:10}
spark.monitoring.fetch-batch-size=${SPARK_MONITORING_FETCH_BATCH:50}

# ── OpenAPI ───────────────────────────────────────────────────────────────────
quarkus.smallrye-openapi.path=/openapi
quarkus.smallrye-openapi.info-title=Spark Batch Monitor API
quarkus.smallrye-openapi.info-version=1.0.0

quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/swagger-ui

# Con root-path=/api, la Swagger UI è raggiungibile su:
# http://localhost:8080/api/swagger-ui
# Il JSON OpenAPI è su:
# http://localhost:8080/api/openapi

# ── Health ────────────────────────────────────────────────────────────────────
quarkus.smallrye-health.root-path=/q/health

# ── Logging ──────────────────────────────────────────────────────────────────
quarkus.log.level=INFO
quarkus.log.category."com.example.sbm".level=DEBUG

# ── Quarkus build type ────────────────────────────────────────────────────────
# Usa fast-jar (default per JVM mode). Disabilita native build esplicito
# per evitare errori di risoluzione della property platform.quarkus.native.builder-image
# che richiede il BOM completo di piattaforma.
quarkus.package.jar.type=fast-jar
quarkus.native.enabled=false

# ── ScheduledJobLauncher ──────────────────────────────────────────────────────
spark.scheduled-launcher.enabled=${SPARK_SCHEDULED_LAUNCHER_ENABLED:true}
# Tick ogni minuto per valutare le cron expressions dei job SCHEDULED
spark.scheduled-launcher.cron=${SPARK_SCHEDULED_LAUNCHER_CRON:0 * * * * ?}
