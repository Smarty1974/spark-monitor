# ─── Server ───────────────────────────────────────────────────────────────────
quarkus.http.port=8081
quarkus.http.root-path=/api

# ─── DataSource PostgreSQL ────────────────────────────────────────────────────
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USER:postgres}
quarkus.datasource.password=${DB_PASSWORD:postgres}
quarkus.datasource.jdbc.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/spark_monitor_db
quarkus.datasource.jdbc.max-size=16
quarkus.datasource.jdbc.min-size=2

# ─── Flyway ───────────────────────────────────────────────────────────────────
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=classpath:db/migration
quarkus.flyway.baseline-on-migrate=true

# ─── CORS ─────────────────────────────────────────────────────────────────────
quarkus.http.cors=true
quarkus.http.cors.origins=*
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS,PATCH
quarkus.http.cors.headers=Content-Type,Authorization,X-Total-Count
quarkus.http.cors.exposed-headers=X-Total-Count

# ─── OpenAPI / Swagger ────────────────────────────────────────────────────────
quarkus.smallrye-openapi.path=/openapi
quarkus.smallrye-openapi.info-title=Spark Monitor API
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/swagger-ui

# ─── Jackson ─────────────────────────────────────────────────────────────────
quarkus.jackson.serialization-inclusion=NON_NULL
quarkus.jackson.write-dates-as-timestamps=false

# ─── Logging ─────────────────────────────────────────────────────────────────
quarkus.log.level=INFO
quarkus.log.category."com.mycompany.sparkmonitor".level=DEBUG
quarkus.log.console.format=%d{HH:mm:ss} %-5p [%c{2.}] (%t) %s%e%n

# ─── Health ───────────────────────────────────────────────────────────────────
quarkus.smallrye-health.ui.always-include=true

# ─── Autenticazione ───────────────────────────────────────────────────────────
# Chiave segreta JWT — CAMBIA IN PRODUZIONE tramite variabile d'ambiente AUTH_JWT_SECRET
auth.jwt-secret=${AUTH_JWT_SECRET:spark-monitor-secret-change-me-in-production}
auth.jwt-expiration-seconds=86400

# Utenti configurabili — aggiungere/modificare liberamente
# Formato: auth.users[N].username / .password / .role (ADMIN | VIEWER)
#
# ⚠️  CAMBIA LE PASSWORD PRIMA DI ANDARE IN PRODUZIONE
#
auth.users[0].username=admin
auth.users[0].password=${ADMIN_PASSWORD:admin}
auth.users[0].role=ADMIN

auth.users[1].username=viewer
auth.users[1].password=${VIEWER_PASSWORD:viewer}
auth.users[1].role=VIEWER

auth.users[2].username=spark
auth.users[2].password=${SPARK_PASSWORD:spark123}
auth.users[2].role=ADMIN
